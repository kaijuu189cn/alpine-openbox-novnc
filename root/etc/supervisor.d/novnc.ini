; websockify + noVNC web UI.
;
; websockify serves the noVNC static files AND proxies the WebSocket stream to
; the local Xvnc RFB port, so everything is reachable on ONE port (3000).
;
; We point --web at /usr/share/novnc and rewrite the default page to vnc.html
; (see the Dockerfile) so http://host:3000 opens the viewer directly.
[program:novnc]
priority=40
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
startretries=20
stdout_logfile=/var/log/supervisor/novnc.log
redirect_stderr=true
