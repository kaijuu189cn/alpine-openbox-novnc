; Openbox window manager, running as the unprivileged abc user.
;
; Waits until the X socket from Xvnc exists before starting, otherwise openbox
; exits immediately and supervisor burns through its restart budget.
[program:openbox]
priority=30
user=abc
environment=HOME="/abc",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="/abc/.XDG"
command=/bin/bash -c 'for i in $(seq 1 60); do xset q >/dev/null 2>&1 && break; sleep 1; done; exec /usr/bin/openbox-session'
autorestart=true
startretries=20
stdout_logfile=/var/log/supervisor/openbox.log
redirect_stderr=true
