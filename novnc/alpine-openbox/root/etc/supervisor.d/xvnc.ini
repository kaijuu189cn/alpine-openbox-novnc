; Xvnc (TigerVNC) -- the X server AND the VNC server in one process.
;
; WHY THIS REPLACED Xvfb + x11vnc (v3)
; ------------------------------------
; Plain Xvfb cannot be resized after it starts: the desktop stayed at whatever
; VNC_RESOLUTION said (1280x800) no matter how big the browser window was. The
; usual fix, noVNC's "resize=remote", works by sending an RFB SetDesktopSize
; message, and x11vnc simply discards it -- measured directly with
; scripts/vncresize.py:
;
;     x11vnc 0.9.17:  before=1280x800  sent 1600x900  after=(1280, 800)   <- ignored
;     Xvnc 1.15:      before=1280x800  sent 1600x900  after=(1600, 900)   <- resized
;
; Xvnc is a real Xorg server with TigerVNC built in, so it can resize the
; framebuffer when the viewer asks and the desktop reflows to match the browser
; window. It also removes a whole process: one service instead of two.
;
; OPTIONS
;   -geometry        the size the desktop STARTS at; VNC_RESOLUTION sets it.
;                    It is not a floor or a ceiling: the viewer can resize the
;                    desktop smaller or larger once connected (measured
;                    800x600 through 1920x1080 all honoured).
;   -SecurityTypes None   no VNC password, like the old `x11vnc -nopw`
;   -localhost       RFB listens on loopback only, because only the websockify
;                    process in this container consumes it. This is stricter
;                    than the old setup (x11vnc listened on all interfaces).
;                    To expose VNC to a native client, drop -localhost AND
;                    publish 5901 -- and be aware there is no password.
;   -ac              no X access control, so the unprivileged abc user can
;                    connect without an Xauthority file (same as Xvfb -ac)
;   -AcceptSetDesktopSize=1   honour the viewer's resize request (the default,
;                    stated here so the reason is visible)
[program:xvnc]
priority=10
command=/usr/bin/Xvnc %(ENV_DISPLAY)s -geometry %(ENV_VNC_RESOLUTION)s -depth %(ENV_VNC_DEPTH)s -dpi 96 -rfbport %(ENV_VNC_PORT)s -SecurityTypes None -localhost -AlwaysShared -AcceptSetDesktopSize=1 -desktop %(ENV_TITLE)s -ac
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/xvnc.log
redirect_stderr=true
